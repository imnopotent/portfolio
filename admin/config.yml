backend:
  name: github
  repo: imnopotent/portfolio
  branch: street

media_folder: "assets/work"
public_folder: "/assets/work"

site_url: https://ilyass.online
display_url: https://ilyass.online

collections:
  - name: site
    label: Site
    files:
      - name: content
        label: Everything
        file: content.json
        format: json
        fields:
          - { name: name, label: Your name, widget: string }
          - { name: role, label: Role, widget: string }
          - { name: email, label: Email, widget: string }
          - name: about
            label: About text
            widget: text
            hint: First paragraph shows on the front page. The rest appears under About.

          - name: links
            label: Links
            label_singular: Link
            widget: list
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Name, widget: string }
              - { name: url, label: URL, widget: string }

          - name: categories
            label: Categories
            label_singular: Category
            widget: list
            collapsed: true
            summary: "{{fields.label}}"
            hint: These are the panels. Drag to reorder them left to right.
            fields:
              - { name: hidden, label: Hide this category, widget: boolean, required: false, default: false }
              - { name: label, label: Name, widget: string }
              - { name: key, label: ID, widget: string, hint: "Lowercase, no spaces. Projects point at this." }
              - { name: blurb, label: One line about it, widget: text }
              - { name: color, label: Panel colour, widget: color }

          - name: projects
            label: Work
            label_singular: Project
            widget: list
            collapsed: true
            summary: "{{fields.title}} — {{fields.category}}"
            fields:
              - { name: hidden, label: Hide this project, widget: boolean, required: false, default: false }
              - { name: title, label: Title, widget: string }
              - { name: slug, label: ID, widget: string, hint: "Lowercase, no spaces, unique." }
              - { name: client, label: Client or kind of work, widget: string, required: false }
              - { name: year, label: Year, widget: string, required: false }
              - { name: category, label: Category ID, widget: string, hint: "Must match a category ID above: branding, packaging, advertising, web, art" }
              - { name: thumb, label: Thumbnail, widget: image, required: false }
              - name: images
                label: Images
                widget: list
                required: false
                field: { name: image, label: Image, widget: image }
              - { name: text, label: Description, widget: text, required: false }
              - name: credits
                label: Credits
                label_singular: Credit
                widget: list
                collapsed: true
                required: false
                summary: "{{fields.role}}"
                fields:
                  - { name: role, label: Role, widget: string }
                  - { name: names, label: Who, widget: text }
