<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ilyass Benfssahi</title>
<meta name="description" content="Graphic design, art and creative direction. Casablanca.">
<meta property="og:title" content="Ilyass Benfssahi">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="mast">
  <button class="mast__name" id="mHome"></button>
  <span class="mast__role" id="mRole"></span>
  <span class="mast__grow"></span>
  <button class="mast__about" id="mAbout">About</button>
</header>

<main class="panels" id="panels" aria-label="Categories"></main>

<div class="hero" id="hero">
  <h1 id="hName"></h1>
  <p id="hAbout"></p>
  <span class="hero__hint">Pick a category</span>
</div>

<div class="about" id="aboutPanel" aria-hidden="true">
  <button class="x" id="aboutClose" aria-label="Close"></button>
  <div class="about__inner">
    <h2 id="aName"></h2>
    <div class="about__text" id="aText"></div>
    <div class="about__services" id="aServices"></div>
    <div class="about__links" id="aLinks"></div>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
  <button class="x" id="sheetClose" aria-label="Close"></button>
  <div class="sheet__scroll" id="sheetScroll"></div>
</div>

<script src="app.js"></script>
</body>
</html>
