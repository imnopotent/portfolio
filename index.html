<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ilyass Benfssahi</title>
<meta name="description" content="Graphic design, art and creative direction. Casablanca.">
<meta property="og:title" content="Ilyass Benfssahi">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="sky" id="sky"></div>

<header class="top">
  <span class="top__name" id="tName"></span>
  <span class="top__role" id="tRole"></span>
  <span class="top__grow"></span>
  <button class="top__index" id="tIndex">Index</button>
</header>

<!-- the street: one long horizontal strip -->
<main class="street" id="street" aria-label="Street">
  <div class="layer layer--far"  id="lFar"></div>
  <div class="layer layer--mid"  id="lMid"></div>
  <div class="layer layer--near" id="lNear"></div>
  <div class="ground" id="ground"></div>
  <div class="stage" id="stage"></div>
</main>

<div class="intro" id="intro">
  <b id="iLine1"></b>
  <span id="iLine2"></span>
  <em id="iHint"></em>
</div>

<div class="progress"><i id="progressBar"></i></div>

<!-- index overlay -->
<div class="index" id="index" aria-hidden="true">
  <button class="index__close" id="indexClose" aria-label="Close"></button>
  <div class="index__inner">
    <div class="index__services" id="idxServices"></div>
    <ol class="index__list" id="idxList"></ol>
    <div class="index__links" id="idxLinks"></div>
  </div>
</div>

<!-- project sheet -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
  <button class="sheet__close" id="sheetClose" aria-label="Close"></button>
  <div class="sheet__scroll" id="sheetScroll"></div>
</div>

<script src="app.js"></script>
</body>
</html>
